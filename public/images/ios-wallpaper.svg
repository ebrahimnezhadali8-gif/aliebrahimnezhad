<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1136" width="640" height="1136" preserveAspectRatio="xMidYMid slice">
  <!--
    iPhone-era wallpaper: the classic saturated "iOS blue" with a bright glow
    in the upper third and soft light rays fanning down from it, plus faint
    out-of-focus clouds near the bottom.
  -->
  <defs>
    <linearGradient id="base" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0b3c8f"/>
      <stop offset="0.22" stop-color="#0f56b8"/>
      <stop offset="0.5" stop-color="#1272d8"/>
      <stop offset="0.78" stop-color="#0d5ec2"/>
      <stop offset="1" stop-color="#08326f"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.5" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.18" stop-color="#bfe4ff" stop-opacity="0.42"/>
      <stop offset="0.52" stop-color="#5aa8f0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="floor" cx="0.5" cy="1.02" r="0.7">
      <stop offset="0" stop-color="#7fc6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur40" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="blur80" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <clipPath id="frame">
      <rect width="640" height="1136"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="1136" fill="url(#base)"/>

    <!-- Light rays fanning out from the glow, the era's signature look. -->
    <g opacity="0.22" filter="url(#blur40)">
      <path d="M320 150 L-40 780 L60 780 Z" fill="#ffffff"/>
      <path d="M320 150 L120 900 L190 900 Z" fill="#ffffff"/>
      <path d="M320 150 L300 980 L370 980 Z" fill="#ffffff"/>
      <path d="M320 150 L470 900 L545 900 Z" fill="#ffffff"/>
      <path d="M320 150 L580 780 L690 780 Z" fill="#ffffff"/>
    </g>

    <rect width="640" height="1136" fill="url(#sun)"/>

    <!-- Soft cloud banks low on the screen. -->
    <g filter="url(#blur80)" fill="#dbeeff" opacity="0.34">
      <ellipse cx="120" cy="820" rx="250" ry="80"/>
      <ellipse cx="540" cy="900" rx="230" ry="72"/>
      <ellipse cx="330" cy="1040" rx="300" ry="88"/>
    </g>

    <g filter="url(#blur40)" fill="#ffffff" opacity="0.24">
      <ellipse cx="90" cy="330" rx="120" ry="40"/>
      <ellipse cx="560" cy="520" rx="140" ry="42"/>
    </g>

    <!-- Slight vignette so the dock and labels stay readable. -->
    <rect width="640" height="1136" fill="url(#floor)"/>
  </g>
</svg>
